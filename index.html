<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Easy 3D Mobile Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen overflow-hidden select-none">

  <!-- Top Bar: Actions -->
  <div class="bg-gray-800 p-2 flex gap-2 overflow-x-auto border-b border-gray-700 shrink-0">
    <button onclick="createHumanPreset()" class="bg-indigo-600 active:bg-indigo-700 px-3 py-2 rounded text-xs font-bold whitespace-nowrap">
      🧍 สร้างตัวคนอัตโนมัติ
    </button>
    <button onclick="addPart('box', 'กล่อง')" class="bg-blue-600 active:bg-blue-700 px-3 py-2 rounded text-xs font-bold whitespace-nowrap">
      ➕ เพิ่มบล็อก
    </button>
    <button onclick="saveAndGetLink()" class="bg-emerald-600 active:bg-emerald-700 px-3 py-2 rounded text-xs font-bold whitespace-nowrap ml-auto">
      💾 เซฟ & เอาลิงก์
    </button>
  </div>

  <!-- Main 3D Canvas Area -->
  <div id="canvas-container" class="flex-1 w-full relative">
    <div id="hint" class="absolute top-2 left-2 bg-black/60 px-3 py-1 rounded text-[11px] text-gray-300 pointer-events-none">
      👉 เอานิ้วลากเพื่อหมุน | จิ้มที่ชิ้นส่วนเพื่อเลือก
    </div>
  </div>

  <!-- Bottom Panel: Controls for Selected Part -->
  <div id="controlPanel" class="bg-gray-800 p-3 border-t border-gray-700 shrink-0 hidden">
    <div class="flex justify-between items-center mb-2">
      <span id="selectedName" class="text-xs font-bold text-emerald-400">ชิ้นส่วนที่เลือก</span>
      <button onclick="deleteCurrent()" class="text-xs bg-red-600 px-2 py-1 rounded">🗑️ ลบ</button>
    </div>

    <!-- Tagging Field -->
    <div class="flex items-center gap-2 mb-2">
      <span class="text-xs text-gray-400 w-12">แท็ก:</span>
      <input id="tagInput" type="text" placeholder="เช่น Head, RightArm" onchange="updateTag(this.value)" class="flex-1 bg-gray-900 border border-emerald-500 rounded px-2 py-1 text-xs text-emerald-300"/>
    </div>

    <!-- Move Buttons Grid -->
    <div class="grid grid-cols-3 gap-1 text-center">
      <div class="text-[10px] text-gray-400 col-span-3">ขยับตำแหน่ง (X / Y / Z)</div>
      <button onclick="moveObj('y', 0.2)" class="bg-gray-700 py-2 rounded font-bold">⬆️ ขึ้น</button>
      <button onclick="moveObj('z', -0.2)" class="bg-gray-700 py-2 rounded font-bold">⬆️ เดินหน้า</button>
      <button onclick="moveObj('y', -0.2)" class="bg-gray-700 py-2 rounded font-bold">⬇️ ลง</button>
      
      <button onclick="moveObj('x', -0.2)" class="bg-gray-700 py-2 rounded font-bold">⬅️ ซ้าย</button>
      <button onclick="moveObj('z', 0.2)" class="bg-gray-700 py-2 rounded font-bold">⬇️ ถอยหลัง</button>
      <button onclick="moveObj('x', 0.2)" class="bg-gray-700 py-2 rounded font-bold">➡️ ขวา</button>
    </div>
  </div>

  <!-- Result Modal -->
  <div id="linkModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-gray-800 p-4 rounded-lg w-full max-w-sm border border-emerald-500">
      <h3 class="text-sm font-bold text-emerald-400 mb-2">🎉 บันทึกสำเร็จ!</h3>
      <p class="text-xs text-gray-300 mb-2">ก๊อปปี้ลิงก์ JSON นี้ไปใส่ในตัวเกมของคุณได้เลย:</p>
      <input id="resultUrl" readonly class="w-full bg-gray-900 p-2 rounded text-xs text-emerald-300 mb-3 border border-gray-700 select-all" />
      <button onclick="document.getElementById('linkModal').classList.add('hidden')" class="w-full bg-indigo-600 py-2 rounded font-bold text-xs">ปิดหน้าต่าง</button>
    </div>
  </div>

  <script>
    // --- Firebase Config ---
    const firebaseConfig = {
      apiKey: "AIzaSyAWUWpDnF5Yt7QQ0ULvsxSVJhV0ckGMfu8",
      authDomain: "chatcharin-af5e4.firebaseapp.com",
      databaseURL: "https://chatcharin-af5e4-default-rtdb.firebaseio.com",
      projectId: "chatcharin-af5e4",
      storageBucket: "chatcharin-af5e4.firebasestorage.app",
      messagingSenderId: "631954642041",
      appId: "1:631954642041:web:586447ace8ad055ca3f0a8",
      measurementId: "G-2GNPMEF6E4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111827);

    const grid = new THREE.GridHelper(10, 10, 0x4b5563, 0x1f2937);
    scene.add(grid);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const light = new THREE.DirectionalLight(0xffffff, 0.6);
    light.position.set(3, 10, 5);
    scene.add(light);

    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 3, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    let parts = [];
    let selected = null;

    // --- Quick Add Part ---
    function addPart(type, name, tag = '', pos = [0, 0.5, 0], scale = [1, 1, 1], color = 0x3b82f6) {
      const geo = type === 'sphere' ? new THREE.SphereGeometry(0.5, 16, 16) : new THREE.BoxGeometry(1, 1, 1);
      const mat = new THREE.MeshStandardMaterial({ color: color });
      const mesh = new THREE.Mesh(geo, mat);

      mesh.position.set(...pos);
      mesh.scale.set(...scale);
      mesh.userData = {
        id: 'p_' + Math.random().toString(36).substr(2, 5),
        name: name,
        tag: tag,
        type: type,
        colorHex: '#' + mesh.material.color.getHexString()
      };

      scene.add(mesh);
      parts.push(mesh);
      selectPart(mesh);
      return mesh;
    }

    // --- Preset: Humanoid Model ---
    function createHumanPreset() {
      // Clear Old
      parts.forEach(p => scene.remove(p));
      parts = [];

      // Body Parts
      addPart('box', 'ลำตัว', 'Torso', [0, 1.5, 0], [0.8, 1.2, 0.4], 0x2563eb);
      addPart('sphere', 'หัว', 'Head', [0, 2.4, 0], [0.8, 0.8, 0.8], 0xf59e0b);
      addPart('box', 'แขนขวา', 'RightArm', [0.65, 1.5, 0], [0.3, 1.0, 0.3], 0x10b981);
      addPart('box', 'แขนซ้าย', 'LeftArm', [-0.65, 1.5, 0], [0.3, 1.0, 0.3], 0x10b981);
      addPart('box', 'ขาขวา', 'RightLeg', [0.25, 0.5, 0], [0.35, 1.0, 0.35], 0xef4444);
      addPart('box', 'ขาซ้าย', 'LeftLeg', [-0.25, 0.5, 0], [0.35, 1.0, 0.35], 0xef4444);

      camera.position.set(0, 2, 4);
      controls.target.set(0, 1.5, 0);
    }

    // --- Selection System ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('pointerdown', (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(parts);

      if (intersects.length > 0) {
        selectPart(intersects[0].object);
      }
    });

    function selectPart(mesh) {
      if (selected) selected.material.emissive.setHex(0x000000);
      selected = mesh;

      if (selected) {
        selected.material.emissive.setHex(0x333333);
        document.getElementById('controlPanel').classList.remove('hidden');
        document.getElementById('selectedName').innerText = `${selected.userData.name} (${selected.userData.tag || 'ไม่มีแท็ก'})`;
        document.getElementById('tagInput').value = selected.userData.tag || '';
      } else {
        document.getElementById('controlPanel').classList.add('hidden');
      }
    }

    function moveObj(axis, val) {
      if (!selected) return;
      selected.position[axis] += val;
    }

    function updateTag(val) {
      if (!selected) return;
      selected.userData.tag = val;
      document.getElementById('selectedName').innerText = `${selected.userData.name} (${val})`;
    }

    function deleteCurrent() {
      if (!selected) return;
      scene.remove(selected);
      parts = parts.filter(p => p !== selected);
      selected = null;
      document.getElementById('controlPanel').classList.add('hidden');
    }

    // --- Save & Get Link ---
    async function saveAndGetLink() {
      if (parts.length === 0) {
        alert('ยังไม่มีโมเดลในฉากเลย!');
        return;
      }

      const exportData = {
        nodes: parts.map(p => ({
          name: p.userData.name,
          tag: p.userData.tag,
          type: p.userData.type,
          color: '#' + p.material.color.getHexString(),
          transform: {
            position: [p.position.x, p.position.y, p.position.z],
            scale: [p.scale.x, p.scale.y, p.scale.z]
          }
        }))
      };

      const ref = db.ref('models').push();
      await ref.set(exportData);

      const url = `https://chatcharin-af5e4-default-rtdb.firebaseio.com/models/${ref.key}.json`;
      document.getElementById('resultUrl').value = url;
      document.getElementById('linkModal').classList.remove('hidden');
    }

    // Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
